<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" fill="none">
  <!-- Transparent Background with Isolated Founder Silhouette & Detail -->
  <g id="ankit-portrait" opacity="0.95">
    <!-- Subtle Back Shoulder Rim Lighting -->
    <path d="M 120 460 C 130 380, 190 320, 250 320 C 310 320, 370 380, 380 460 L 410 650 L 90 650 Z" fill="url(#suitGrad1)" />
    
    <!-- Crisp Shirt Collar -->
    <path d="M 210 320 L 250 390 L 290 320 L 270 300 L 230 300 Z" fill="#F8FAFC" />
    <path d="M 250 390 L 240 500 L 260 500 Z" fill="#7C5CFC" />

    <!-- Neck & Jawline -->
    <path d="M 215 250 C 215 310, 285 310, 285 250 Z" fill="#E2BA9D" />
    <path d="M 215 260 C 240 280, 260 280, 285 260" stroke="#C49B7E" stroke-width="2" />

    <!-- Head & Face Profile -->
    <path d="M 180 190 C 180 100, 320 100, 320 190 C 320 260, 180 260, 180 190 Z" fill="#F0CCA8" />
    
    <!-- Hair & Beard (Architectural Executive) -->
    <path d="M 175 160 C 170 90, 240 60, 310 70 C 330 90, 335 140, 325 170 C 315 130, 290 100, 240 100 C 190 100, 180 140, 175 160 Z" fill="#1E2330" />
    <path d="M 195 230 C 210 275, 290 275, 305 230 C 305 250, 290 275, 250 275 C 210 275, 195 250, 195 230 Z" fill="#282D3D" opacity="0.8" />

    <!-- Glasses (Architect Signature) -->
    <rect x="195" y="170" width="45" height="30" rx="6" stroke="#C9A84C" stroke-width="3" fill="#C9A84C" fill-opacity="0.1" />
    <rect x="260" y="170" width="45" height="30" rx="6" stroke="#C9A84C" stroke-width="3" fill="#C9A84C" fill-opacity="0.1" />
    <line x1="240" y1="182" x2="260" y2="182" stroke="#C9A84C" stroke-width="3" />

    <!-- Eyes & Expression -->
    <ellipse cx="218" cy="184" rx="4" ry="5" fill="#181B24" />
    <ellipse cx="282" cy="184" rx="4" ry="5" fill="#181B24" />
    <path d="M 240 195 L 246 215 L 254 215" stroke="#C49B7E" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 235 235 Q 250 242, 265 235" stroke="#C49B7E" stroke-width="2.5" stroke-linecap="round" />

    <!-- Executive Charcoal Blazer -->
    <path d="M 90 650 L 150 440 L 220 330 L 250 490 L 280 330 L 350 440 L 410 650 Z" fill="url(#blazerGrad1)" />
    
    <!-- Gold Pocket Square & Lapel Accent -->
    <path d="M 160 490 L 195 485 L 180 505 Z" fill="#C9A84C" />
    <line x1="220" y1="330" x2="245" y2="480" stroke="#7C5CFC" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="280" y1="330" x2="255" y2="480" stroke="#7C5CFC" stroke-width="1.5" stroke-opacity="0.6" />
  </g>
  <defs>
    <linearGradient id="suitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2D" />
      <stop offset="100%" stop-color="#0A0D15" />
    </linearGradient>
    <linearGradient id="blazerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212638" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0D101A" />
    </linearGradient>
  </defs>
</svg>

