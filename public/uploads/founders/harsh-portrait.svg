<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" fill="none">
  <!-- Transparent Background with Isolated Founder Silhouette & Detail -->
  <g id="harsh-portrait" opacity="0.95">
    <!-- Back Shoulder Contour -->
    <path d="M 110 460 C 125 375, 185 315, 250 315 C 315 315, 375 375, 390 460 L 420 650 L 80 650 Z" fill="url(#suitGrad2)" />
    
    <!-- Modern Tech Mandarin Collar Shirt -->
    <path d="M 215 315 L 250 370 L 285 315 L 270 295 L 230 295 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Neck & Jawline -->
    <path d="M 215 240 C 215 305, 285 305, 285 240 Z" fill="#DFBA9C" />
    <path d="M 215 255 C 240 275, 260 275, 285 255" stroke="#BF9778" stroke-width="2" />

    <!-- Head & Face Profile -->
    <path d="M 185 185 C 185 95, 315 95, 315 185 C 315 255, 185 255, 185 185 Z" fill="#E8C4A2" />
    
    <!-- Modern Hair & Subtle Stubble -->
    <path d="M 180 150 C 175 80, 235 55, 320 65 C 330 95, 330 140, 315 160 C 310 120, 280 90, 240 90 C 190 90, 185 130, 180 150 Z" fill="#151A26" />
    <path d="M 200 230 C 215 265, 285 265, 300 230 C 300 248, 285 268, 250 268 C 215 268, 200 248, 200 230 Z" fill="#202636" opacity="0.6" />

    <!-- Sharp Tech Focus Eyebrows & Eyes -->
    <path d="M 205 170 Q 225 165, 235 172" stroke="#151A26" stroke-width="3" stroke-linecap="round" />
    <path d="M 265 172 Q 275 165, 295 170" stroke="#151A26" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="222" cy="182" rx="4" ry="4.5" fill="#181B24" />
    <ellipse cx="278" cy="182" rx="4" ry="4.5" fill="#181B24" />
    <circle cx="224" cy="180" r="1.5" fill="#38BDF8" opacity="0.8" />
    <circle cx="280" cy="180" r="1.5" fill="#38BDF8" opacity="0.8" />
    <path d="M 243 192 L 248 212 L 255 212" stroke="#BF9778" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 238 232 Q 250 238, 262 232" stroke="#BF9778" stroke-width="2.5" stroke-linecap="round" />

    <!-- Structured Tech Bomber / Blazer with Cyan Accents -->
    <path d="M 80 650 L 145 435 L 215 320 L 250 480 L 285 320 L 355 435 L 420 650 Z" fill="url(#blazerGrad2)" />
    
    <!-- Circuit lines on shoulder -->
    <path d="M 140 460 L 165 480 L 165 530" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3" />
    <circle cx="165" cy="530" r="3" fill="#38BDF8" />
  </g>
  <defs>
    <linearGradient id="suitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B2B" />
      <stop offset="100%" stop-color="#070D18" />
    </linearGradient>
    <linearGradient id="blazerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="50%" stop-color="#101827" />
      <stop offset="100%" stop-color="#0A0E18" />
    </linearGradient>
  </defs>
</svg>

