<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" fill="none">
  <!-- Transparent Background with Isolated Founder Silhouette & Detail -->
  <g id="akshay-portrait" opacity="0.95">
    <!-- Back Shoulder Contour -->
    <path d="M 115 455 C 130 375, 185 315, 250 315 C 315 315, 370 375, 385 455 L 415 650 L 85 650 Z" fill="url(#suitGrad3)" />
    
    <!-- Minimalist Black Turtleneck / Creative Outfit -->
    <path d="M 215 300 C 215 340, 285 340, 285 300 L 285 260 L 215 260 Z" fill="#0C0E14" />
    <path d="M 215 260 C 235 270, 265 270, 285 260" stroke="#F472B6" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Head & Face Profile -->
    <path d="M 185 180 C 185 95, 315 95, 315 180 C 315 250, 185 250, 185 180 Z" fill="#E8C3A4" />
    
    <!-- Creative Sculpted Hair & Clean Look -->
    <path d="M 175 155 C 170 85, 230 50, 315 60 C 335 85, 330 145, 315 170 C 305 130, 275 95, 235 95 C 190 95, 180 135, 175 155 Z" fill="#1C1E26" />
    <path d="M 290 80 Q 320 100, 310 130" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Creative Designer Glasses (Round Thin Wireframe) -->
    <circle cx="220" cy="180" r="22" stroke="#E2C978" stroke-width="2.5" fill="#E2C978" fill-opacity="0.08" />
    <circle cx="280" cy="180" r="22" stroke="#E2C978" stroke-width="2.5" fill="#E2C978" fill-opacity="0.08" />
    <path d="M 242 180 Q 250 176, 258 180" stroke="#E2C978" stroke-width="2.5" />

    <!-- Eyes & Expression -->
    <ellipse cx="220" cy="180" rx="4" ry="4.5" fill="#181B24" />
    <ellipse cx="280" cy="180" rx="4" ry="4.5" fill="#181B24" />
    <path d="M 245 190 L 249 210 L 256 210" stroke="#C49B7E" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 238 230 Q 250 236, 262 230" stroke="#C49B7E" stroke-width="2.2" stroke-linecap="round" />

    <!-- Tailored Designer Overshirt / Kimono Cut with Rose/Violet accents -->
    <path d="M 85 650 L 150 435 L 215 305 L 250 470 L 285 305 L 350 435 L 415 650 Z" fill="url(#blazerGrad3)" />
    
    <!-- Subtle aesthetic accent line -->
    <path d="M 330 460 Q 350 510, 340 560" stroke="#F472B6" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="340" cy="560" r="3" fill="#F472B6" />
  </g>
  <defs>
    <linearGradient id="suitGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1528" />
      <stop offset="100%" stop-color="#0E0A17" />
    </linearGradient>
    <linearGradient id="blazerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E34" />
      <stop offset="50%" stop-color="#171223" />
      <stop offset="100%" stop-color="#0E0B16" />
    </linearGradient>
  </defs>
</svg>

